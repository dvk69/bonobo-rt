[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonobo"
version = "0.7.0rc2"
description = "Bonobo, a simple, modern and atomic extract-transform-load toolkit for python 3.5+."
readme = "README.rst"
license = { text = "Apache License, Version 2.0" }
authors = [{ name = "Romain Dorgueil", email = "romain@dorgueil.net" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fs~=2.0",
    "graphviz>=0.20",
    "jinja2>=3.0",
    "mondrian~=0.8",
    "packaging>=24",
    "psutil>=6",
    "python-slugify>=8",
    "requests~=2.0",
    "stevedore>=5",
    "whistle~=1.0",
]

[project.urls]
Homepage = "https://www.bonobo-project.org/"
Source = "https://github.com/python-bonobo/bonobo"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "coverage>=7",
    "sphinx>=7",
    "cookiecutter>=2",
]
docker = ["bonobo-docker~=0.6.0a1"]
jupyter = ["ipywidgets~=6.0", "jupyter~=1.0"]
sqlalchemy = ["bonobo-sqlalchemy~=0.6.0a1"]

[project.scripts]
bonobo = "bonobo.commands:entrypoint"

[project.entry-points."bonobo.commands"]
convert = "bonobo.commands.convert:ConvertCommand"
download = "bonobo.commands.download:DownloadCommand"
examples = "bonobo.commands.examples:ExamplesCommand"
init = "bonobo.commands.init:InitCommand"
inspect = "bonobo.commands.inspect:InspectCommand"
run = "bonobo.commands.run:RunCommand"
version = "bonobo.commands.version:VersionCommand"

[tool.setuptools.packages.find]
exclude = ["ez_setup", "example", "test"]

[tool.setuptools.package-data]
"*" = ["*.svg", "*.rst"]

[tool.pytest.ini_options]
addopts = "--capture=no --cov=bonobo --cov-report html"

[tool.coverage.run]
omit = ["bonobo/examples/*", "bonobo/ext/*"]

[tool.isort]
multi_line_output = 5
known_first_party = ["bonobo"]
known_third_party = ["mondrian", "whistle"]

[tool.black]
line-length = 120
